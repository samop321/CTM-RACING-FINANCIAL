<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

// ---------- Config ----------
const SUPABASE_URL = "https://ziczoosvticevufijvex.supabase.co";
const SUPABASE_KEY = "sb_publishable_aH_TUrjUJ9rqzdkTDC4fCA_3Nh7wSm1";

const COORDINATORS = ["Samuel Paučin", "Tomáš Tóth"];
const RIDERS = ["Martin Knapec", "Adam Milo", "Richard Tandara", "Enzo Šplha", "Filip Uhrín"];
const ALL_MEMBERS = [...COORDINATORS, ...RIDERS];

const CATEGORIES = [
  { id: "phm", label: "PHM", color: "#F97316", emoji: "⛽" },
  { id: "ubytovanie", label: "Ubytovanie", color: "#2563EB", emoji: "🏨" },
  { id: "lanovka", label: "Lanovka", color: "#0EA5E9", emoji: "🚠" },

  { id: "parkovne", label: "Parkovné", color: "#64748B", emoji: "🅿️" },

const CAT_MAP = Object.fromEntries(CATEGORIES.map((c) => [c.id, c]));
const CURRENCIES = ["EUR", "CZK", "PLN"];
const RATES_TO_EUR = { EUR: 1, CZK: 0.04, PLN: 0.235 };

// ---------- Helpers ----------
const fmtEUR = (n) => new Intl.NumberFormat("sk-SK", { style: "currency", currency: "EUR" }).format(n || 0);
const fmtMoney = (n, cur) => new Intl.NumberFormat("sk-SK", { style: "currency", currency: cur }).format(n || 0);
const fmtDate = (iso) => (iso ? new Intl.DateTimeFormat("sk-SK", { day: "numeric", month: "long", year: "numeric" }).format(new Date(iso + "T00:00:00")) : "");
const fmtDateShort = (iso) => (iso ? new Intl.DateTimeFormat("sk-SK", { day: "numeric", month: "short" }).format(new Date(iso + "T00:00:00")) : "");
const todayISO = () => new Date().toISOString().slice(0, 10);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const raceStatus = (r) => { const t = todayISO(); return t >= r.startDate && t <= r.endDate ? "prebieha" : t < r.startDate ? "buduci" : "minuly"; };

function fileToCompressedBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1280;
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function extractReceiptData(dataUrl) {
  const base64 = dataUrl.split(",")[1];
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 500,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: "image/jpeg", data: base64 } },
          { type: "text", text: "Toto je fotka účtenky. Odpovedz IBA JSON objektom, žiadny iný text:\n" +
            '{"amount": <suma alebo null>, "currency": <"EUR"|"CZK"|"PLN"|null>, "date": <"YYYY-MM-DD" alebo null>, "vendor": <obchod alebo null>}' },
        ],
      }],
    }),
  });
  const data = await response.json();
  const textBlock = (data.content || []).find((b) => b.type === "text");
  if (!textBlock) throw new Error("Prázdna odpoveď");
  return JSON.parse(textBlock.text.replace(/```json|```/g, "").trim());
}

// ---------- Supabase storage ----------
async function kvGet(key) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(key)}&select=value`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
  });
  if (!res.ok) throw new Error("Supabase GET zlyhalo " + res.status);
  const rows = await res.json();
  return rows.length ? rows[0].value : null;
}
async function kvSet(key, value) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/kv_store`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=minimal",
    },
    body: JSON.stringify([{ key, value, updated_at: new Date().toISOString() }]),
  });
  if (!res.ok) throw new Error("Supabase SET zlyhalo " + res.status);
  return true;
}
async function kvDelete(key) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(key)}`, {
    method: "DELETE", headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
  });
  return res.ok;
}
async function loadShared(key, fallback) {
  try { const v = await kvGet(key); return v !== null && v !== undefined ? v : fallback; }
  catch (e) { console.warn("load failed", key, e); return fallback; }
}
async function saveShared(key, value) {
  try { await kvSet(key, value); return true; }
  catch (e) { console.error("save failed", key, e); return false; }
}

// ---------- App ----------
function App() {
  const [currentUser, setCurrentUser] = useState(null);
  const [pendingName, setPendingName] = useState(null);
  const [pins, setPins] = useState(null);
  const [booted, setBooted] = useState(false);
  const [tab, setTab] = useState("home");
  const [races, setRaces] = useState([]);
  const [expenses, setExpenses] = useState([]);
  const [loading, setLoading] = useState(true);
  const [openRaceId, setOpenRaceId] = useState(null);
  const [showAddExpense, setShowAddExpense] = useState(false);
  const [showAddRace, setShowAddRace] = useState(false);
  const [prefillRaceId, setPrefillRaceId] = useState(null);
  const [toast, setToast] = useState(null);

  const isCoordinator = COORDINATORS.includes(currentUser);

  useEffect(() => {
    (async () => {
      const loadedPins = await loadShared("ctm-pins", {});
      setPins(loadedPins);
      try {
        const saved = localStorage.getItem("ctm-current-user");
        if (saved && ALL_MEMBERS.includes(saved)) setCurrentUser(saved);
      } catch (e) {}
      setBooted(true);
    })();
  }, []);

  const savePin = async (name, pin) => {
    const next = { ...(pins || {}), [name]: pin };
    setPins(next);
    return saveShared("ctm-pins", next);
  };

  const refreshAll = useCallback(async () => {
    setLoading(true);
    const [r, e] = await Promise.all([loadShared("ctm-races", []), loadShared("ctm-expenses", [])]);
    setRaces(r); setExpenses(e); setLoading(false);
  }, []);

  useEffect(() => { if (currentUser) refreshAll(); }, [currentUser, refreshAll]);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2400); };

  const handleLogin = (name) => {
    setCurrentUser(name);
    try { localStorage.setItem("ctm-current-user", name); } catch (e) {}
  };
  const handleLogout = () => {
    setCurrentUser(null);
    try { localStorage.removeItem("ctm-current-user"); } catch (e) {}
  };

  const addRace = async (race) => {
    const next = [...races, { ...race, id: uid() }].sort((a, b) => a.startDate.localeCompare(b.startDate));
    setRaces(next);
    const ok = await saveShared("ctm-races", next);
    showToast(ok ? "Pretek pridaný" : "Chyba pri ukladaní");
    setShowAddRace(false);
  };
  const deleteRace = async (id) => {
    const next = races.filter((r) => r.id !== id);
    const nextExp = expenses.filter((e) => e.raceId !== id);
    setRaces(next); setExpenses(nextExp);
    await saveShared("ctm-races", next);
    await saveShared("ctm-expenses", nextExp);
    setOpenRaceId(null);
    showToast("Pretek zmazaný");
  };
  const addExpense = async (expense) => {
    const next = [...expenses, expense];
    setExpenses(next);
    const ok = await saveShared("ctm-expenses", next);
    showToast(ok ? "Bloček uložený" : "Chyba pri ukladaní bločku");
  };
  const deleteExpense = async (id) => {
    const next = expenses.filter((e) => e.id !== id);
    setExpenses(next);
    await saveShared("ctm-expenses", next);
    try { await kvDelete("ctm-receipt:" + id); } catch (e) {}
    showToast("Bloček zmazaný");
  };

  if (!booted || pins === null) return <CenterSpinner />;

  if (!currentUser) {
    if (pendingName) {
      return (
        <PinScreen
          name={pendingName}
          hasExistingPin={Boolean(pins[pendingName])}
          onBack={() => setPendingName(null)}
          onVerify={(pin) => pins[pendingName] === pin}
          onCreate={async (pin) => { const ok = await savePin(pendingName, pin); if (ok) showToast("PIN nastavený"); return ok; }}
          onSuccess={() => { handleLogin(pendingName); setPendingName(null); }}
        />
      );
    }
    return <LoginScreen onSelectName={setPendingName} />;
  }

  const openRace = races.find((r) => r.id === openRaceId);

  return (
    <div className="min-h-screen bg-gray-50 text-gray-900 flex flex-col">
      <header className="bg-white border-b border-gray-200 px-5 py-3 flex items-center justify-between sticky top-0 z-30">
        <div>
          <div className="text-xs tracking-widest font-semibold text-orange-600 uppercase">CTM Racing Team</div>
          <div className="text-sm font-bold -mt-0.5">Financial</div>
        </div>
        <button onClick={handleLogout} className="flex items-center gap-1.5 text-xs text-gray-500 px-2 py-1.5 rounded-lg hover:bg-gray-100">
          <span className="font-medium">{currentUser}</span> ⏻
        </button>
      </header>

      <main className="flex-1 overflow-y-auto pb-24 max-w-md w-full mx-auto">
        {loading ? <CenterSpinner /> : openRace ? (
          <RaceDetail race={openRace} expenses={expenses.filter((e) => e.raceId === openRace.id)}
            currentUser={currentUser} isCoordinator={isCoordinator} onBack={() => setOpenRaceId(null)}
            onDeleteExpense={deleteExpense}
            onAddExpense={() => { setPrefillRaceId(openRace.id); setShowAddExpense(true); }}
            onDeleteRace={isCoordinator ? () => deleteRace(openRace.id) : null} />
        ) : tab === "home" ? (
          <HomeScreen races={races} expenses={expenses} onOpenRace={setOpenRaceId}
            onQuickAdd={() => { setPrefillRaceId(null); setShowAddExpense(true); }} />
        ) : tab === "calendar" ? (
          <CalendarScreen races={races} isCoordinator={isCoordinator} onOpenRace={setOpenRaceId} onAddRace={() => setShowAddRace(true)} />
        ) : (
          <StatsScreen races={races} expenses={expenses} />
        )}
      </main>

      {!openRace && <BottomNav tab={tab} setTab={setTab} />}

      {showAddExpense && (
        <AddExpenseModal races={races} defaultRaceId={prefillRaceId} currentUser={currentUser}
          onClose={() => setShowAddExpense(false)}
          onSave={async (expense) => { await addExpense(expense); setShowAddExpense(false); }} />
      )}
      {showAddRace && <AddRaceModal onClose={() => setShowAddRace(false)} onSave={addRace} />}
      {toast && <div className="fixed bottom-24 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-sm px-4 py-2 rounded-full shadow-lg z-50">{toast}</div>}
    </div>
  );
}

function CenterSpinner() {
  return <div className="flex items-center justify-center h-64"><div className="w-7 h-7 border-2 border-orange-600 border-t-transparent rounded-full animate-spin" /></div>;
}

function BottomNav({ tab, setTab }) {
  const items = [{ id: "home", label: "Domov", icon: "🏠" }, { id: "calendar", label: "Kalendár", icon: "📅" }, { id: "stats", label: "Štatistiky", icon: "📊" }];
  return (
    <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-30">
      <div className="max-w-md mx-auto grid grid-cols-3">
        {items.map(({ id, label, icon }) => (
          <button key={id} onClick={() => setTab(id)} className={`flex flex-col items-center gap-1 py-2.5 text-xs font-medium ${tab === id ? "text-orange-600" : "text-gray-400"}`}>
            <span className="text-lg leading-none">{icon}</span>{label}
          </button>
        ))}
      </div>
    </nav>
  );
}

function LoginScreen({ onSelectName }) {
  return (
    <div className="min-h-screen bg-gray-50 flex flex-col items-center justify-center px-6">
      <div className="text-xs tracking-widest font-semibold text-orange-600 uppercase mb-1">CTM Racing Team</div>
      <h1 className="text-2xl font-bold mb-8">Financial</h1>
      <div className="w-full max-w-xs">
        <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2 px-1">Koordinátori</div>
        <div className="space-y-2 mb-6">
          {COORDINATORS.map((name) => (
            <button key={name} onClick={() => onSelectName(name)} className="w-full text-left bg-white border border-gray-200 rounded-xl px-4 py-3.5 font-medium flex items-center justify-between hover:border-orange-600">
              {name}<span className="text-gray-400">›</span>
            </button>
          ))}
        </div>
        <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2 px-1">Jazdci</div>
        <div className="space-y-2">
          {RIDERS.map((name) => (
            <button key={name} onClick={() => onSelectName(name)} className="w-full text-left bg-white border border-gray-200 rounded-xl px-4 py-3.5 font-medium flex items-center justify-between hover:border-orange-600">
              {name}<span className="text-gray-400">›</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

function PinScreen({ name, hasExistingPin, onBack, onVerify, onCreate, onSuccess }) {
  const [pin, setPin] = useState(""); const [confirmPin, setConfirmPin] = useState("");
  const [error, setError] = useState(""); const [saving, setSaving] = useState(false);

  const handleVerify = () => {
    if (pin.length !== 4) return;
    if (onVerify(pin)) onSuccess(); else { setError("Nesprávny PIN, skús znova"); setPin(""); }
  };
  const handleCreate = async () => {
    if (pin.length !== 4) return;
    if (pin !== confirmPin) { setError("PIN sa nezhoduje, skús znova"); setConfirmPin(""); return; }
    setSaving(true);
    const ok = await onCreate(pin);
    setSaving(false);
    if (ok) onSuccess(); else setError("Nepodarilo sa uložiť PIN, skús to znova");
  };

  return (
    <div className="min-h-screen bg-gray-50 flex flex-col items-center justify-center px-6 relative">
      <button onClick={onBack} className="absolute top-6 left-6 flex items-center gap-1 text-sm text-gray-500">‹ Späť</button>
      <div className="text-xs tracking-widest font-semibold text-orange-600 uppercase mb-1">{hasExistingPin ? "Prihlásenie" : "Vytvoriť PIN"}</div>
      <h1 className="text-xl font-bold mb-1">{name}</h1>
      <p className="text-sm text-gray-500 mb-6 text-center max-w-xs">
        {hasExistingPin ? "Zadaj svoj 4-miestny PIN" : "Prvé prihlásenie – vytvor si 4-miestny PIN"}
      </p>
      <div className="w-full max-w-xs space-y-4">
        <input type="password" inputMode="numeric" maxLength={4} value={pin}
          onChange={(e) => { setError(""); setPin(e.target.value.replace(/\D/g, "")); }}
          placeholder="••••" autoFocus
          className="w-full text-center text-2xl tracking-widest border border-gray-200 rounded-xl py-4 bg-white focus:outline-none focus:border-orange-600" />
        {!hasExistingPin && (
          <input type="password" inputMode="numeric" maxLength={4} value={confirmPin}
            onChange={(e) => { setError(""); setConfirmPin(e.target.value.replace(/\D/g, "")); }}
            placeholder="Zopakuj PIN"
            className="w-full text-center text-2xl tracking-widest border border-gray-200 rounded-xl py-4 bg-white focus:outline-none focus:border-orange-600" />
        )}
        {error && <div className="text-red-500 text-xs text-center">{error}</div>}
        <button disabled={hasExistingPin ? pin.length !== 4 : pin.length !== 4 || confirmPin.length !== 4 || saving}
          onClick={hasExistingPin ? handleVerify : handleCreate}
          className="w-full bg-orange-600 disabled:bg-gray-200 disabled:text-gray-400 text-white rounded-xl py-3.5 font-semibold text-sm">
          {hasExistingPin ? "Prihlásiť sa" : "Vytvoriť a prihlásiť sa"}
        </button>
      </div>
    </div>
  );
}

function HomeScreen({ races, expenses, onOpenRace, onQuickAdd }) {
  const t = todayISO();
  const current = races.find((r) => t >= r.startDate && t <= r.endDate);
  const next = races.filter((r) => r.startDate > t).sort((a, b) => a.startDate.localeCompare(b.startDate))[0];
  const featured = current || next;
  const featuredSpend = featured ? expenses.filter((e) => e.raceId === featured.id).reduce((s, e) => s + e.amountEUR, 0) : 0;
  const daysUntil = (iso) => Math.round((new Date(iso + "T00:00:00") - new Date(t + "T00:00:00")) / 86400000);

  return (
    <div className="px-5 pt-5">
      <button onClick={onQuickAdd} className="w-full bg-orange-600 text-white rounded-2xl py-4 flex items-center justify-center gap-2 font-semibold text-base shadow-sm mb-5 active:scale-95 transition-transform">
        📷 Pridať bloček
      </button>

      {featured ? (
        <button onClick={() => onOpenRace(featured.id)} className="w-full text-left bg-white rounded-2xl border border-gray-200 p-5 mb-6">
          <div className="flex items-center justify-between mb-3">
            <span className={`text-xs font-bold uppercase tracking-wide px-2 py-1 rounded-full ${current ? "bg-red-50 text-red-600" : "bg-blue-50 text-blue-600"}`}>
              {current ? "● Prebieha teraz" : `O ${daysUntil(featured.startDate)} dní`}
            </span>
            <span className="text-gray-400">›</span>
          </div>
          <div className="mono text-2xl font-bold tracking-tight mb-1">{featured.name}</div>
          <div className="flex items-center gap-1.5 text-sm text-gray-500 mb-4">📍 {featured.location} · {fmtDateShort(featured.startDate)} – {fmtDateShort(featured.endDate)}</div>
          {current && (
            <div className="flex items-center justify-between pt-3 border-t border-gray-100">
              <span className="text-xs text-gray-400">Minuté tento víkend</span>
              <span className="mono font-bold text-lg">{fmtEUR(featuredSpend)}</span>
            </div>
          )}
        </button>
      ) : (
        <div className="bg-white rounded-2xl border border-gray-200 p-6 text-center mb-6">
          <div className="text-3xl mb-2">📅</div>
          <div className="text-sm text-gray-500">Zatiaľ žiadny naplánovaný pretek</div>
        </div>
      )}

      <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2 px-1">Posledné bločky</div>
      <div className="space-y-2">
        {expenses.slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt)).slice(0, 5).map((e) => <ExpenseRow key={e.id} expense={e} />)}
        {expenses.length === 0 && <div className="text-sm text-gray-400 text-center py-6">Zatiaľ žiadne bločky</div>}
      </div>
    </div>
  );
}

function ExpenseRow({ expense }) {
  const cat = CAT_MAP[expense.category];
  return (
    <div className="bg-white rounded-xl border border-gray-200 p-3 flex items-center gap-3">
      <div className="w-9 h-9 rounded-lg flex items-center justify-center shrink-0 text-lg" style={{ backgroundColor: cat.color + "1A" }}>{cat.emoji}</div>
      <div className="flex-1 min-w-0">
        <div className="text-sm font-medium truncate">{expense.vendor || cat.label}</div>
        <div className="text-xs text-gray-400 truncate">{expense.addedBy} · {fmtDateShort(expense.date)}</div>
      </div>
      <div className="text-right shrink-0">
        <div className="mono font-semibold text-sm">{fmtMoney(expense.amount, expense.currency)}</div>
        {expense.currency !== "EUR" && <div className="text-xs text-gray-400 mono">≈ {fmtEUR(expense.amountEUR)}</div>}
      </div>
    </div>
  );
}

function CalendarScreen({ races, isCoordinator, onOpenRace, onAddRace }) {
  const t = todayISO();
  const upcoming = races.filter((r) => r.endDate >= t).sort((a, b) => a.startDate.localeCompare(b.startDate));
  const past = races.filter((r) => r.endDate < t).sort((a, b) => b.startDate.localeCompare(a.startDate));
  return (
    <div className="px-5 pt-5">
      {isCoordinator && (
        <button onClick={onAddRace} className="w-full border-2 border-dashed border-gray-300 text-gray-500 rounded-xl py-3 flex items-center justify-center gap-2 text-sm font-medium mb-6 hover:border-orange-600 hover:text-orange-600">
          ＋ Pridať pretek
        </button>
      )}
      <Section title="Nadchádzajúce preteky">
        {upcoming.length === 0 && <EmptyRow text="Žiadne naplánované preteky" />}
        {upcoming.map((r) => <RaceRow key={r.id} race={r} onClick={() => onOpenRace(r.id)} />)}
      </Section>
      <Section title="Prebehnuté preteky">
        {past.length === 0 && <EmptyRow text="Zatiaľ žiadne odjazdené preteky" />}
        {past.map((r) => <RaceRow key={r.id} race={r} onClick={() => onOpenRace(r.id)} />)}
      </Section>
    </div>
  );
}
function Section({ title, children }) { return <div className="mb-6"><div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2 px-1">{title}</div><div className="space-y-2">{children}</div></div>; }
function EmptyRow({ text }) { return <div className="text-sm text-gray-400 text-center py-4">{text}</div>; }
function RaceRow({ race, onClick }) {
  const status = raceStatus(race);
  return (
    <button onClick={onClick} className="w-full text-left bg-white rounded-xl border border-gray-200 p-4 flex items-center justify-between">
      <div className="min-w-0">
        <div className="font-semibold text-base truncate">{race.name}</div>
        <div className="text-xs text-gray-400 flex items-center gap-1 mt-0.5">📍 {race.location} · {fmtDateShort(race.startDate)} – {fmtDateShort(race.endDate)}</div>
      </div>
      <div className="flex items-center gap-2 shrink-0">
        {status === "prebieha" && <span className="text-xs font-bold uppercase text-red-600 bg-red-50 px-2 py-1 rounded-full">Live</span>}
        <span className="text-gray-400">›</span>
      </div>
    </button>
  );
}

function RaceDetail({ race, expenses, currentUser, isCoordinator, onBack, onDeleteExpense, onAddExpense, onDeleteRace }) {
  const total = expenses.reduce((s, e) => s + e.amountEUR, 0);
  const byCategory = CATEGORIES.map((c) => ({ ...c, sum: expenses.filter((e) => e.category === c.id).reduce((s, e) => s + e.amountEUR, 0) })).filter((c) => c.sum > 0);
  return (
    <div className="px-5 pt-5">
      <button onClick={onBack} className="flex items-center gap-1 text-sm text-gray-500 mb-4">‹ Späť</button>
      <div className="mb-1 mono text-2xl font-bold tracking-tight">{race.name}</div>
      <div className="flex items-center gap-1.5 text-sm text-gray-500 mb-5">📍 {race.location} · {fmtDate(race.startDate)} – {fmtDate(race.endDate)}</div>
      <div className="bg-gray-900 text-white rounded-2xl p-5 mb-5">
        <div className="text-xs text-gray-400 mb-1">Vyúčtovanie víkendu</div>
        <div className="mono text-3xl font-bold mb-4">{fmtEUR(total)}</div>
        <div className="space-y-2">
          {byCategory.map((c) => (
            <div key={c.id} className="flex items-center gap-2">
              <span className="text-xs text-gray-300 w-28 truncate">{c.label}</span>
              <div className="flex-1 h-1.5 bg-white/10 rounded-full overflow-hidden"><div className="h-full rounded-full" style={{ width: `${total ? (c.sum / total) * 100 : 0}%`, backgroundColor: c.color }} /></div>
              <span className="mono text-xs w-16 text-right">{fmtEUR(c.sum)}</span>
            </div>
          ))}
          {byCategory.length === 0 && <div className="text-xs text-gray-400">Zatiaľ žiadne bločky</div>}
        </div>
      </div>
      <button onClick={onAddExpense} className="w-full bg-orange-600 text-white rounded-xl py-3.5 flex items-center justify-center gap-2 font-semibold text-sm mb-5">📷 Pridať bloček k tomuto preteku</button>
      <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2 px-1">Bločky ({expenses.length})</div>
      <div className="space-y-2 mb-6">
        {expenses.slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt)).map((e) => (
          <SwipeableExpense key={e.id} expense={e} canDelete={isCoordinator || e.addedBy === currentUser} onDelete={() => onDeleteExpense(e.id)} />
        ))}
        {expenses.length === 0 && <EmptyRow text="Zatiaľ žiadne bločky k tomuto preteku" />}
      </div>
      {onDeleteRace && (
        <button onClick={() => { if (confirm(`Naozaj zmazať pretek "${race.name}" a všetky jeho bločky?`)) onDeleteRace(); }} className="w-full text-red-500 text-xs font-medium py-3 flex items-center justify-center gap-1.5">🗑️ Zmazať pretek</button>
      )}
    </div>
  );
}
function SwipeableExpense({ expense, canDelete, onDelete }) {
  const [open, setOpen] = useState(false);
  return (
    <div>
      <button onClick={() => setOpen(!open)} className="w-full text-left"><ExpenseRow expense={expense} /></button>
      {open && (
        <div className="bg-gray-50 border border-t-0 border-gray-200 rounded-b-xl px-3 py-3 -mt-2 flex items-center justify-between">
          {expense.note && <div className="text-xs text-gray-500 flex-1 pr-2">{expense.note}</div>}
          {canDelete && <button onClick={onDelete} className="text-red-500 text-xs font-medium flex items-center gap-1 shrink-0">🗑️ Zmazať</button>}
        </div>
      )}
    </div>
  );
}

function ModalShell({ title, onClose, footer, children }) {
  return (
    <div className="fixed inset-0 bg-black/40 z-40 flex items-end sm:items-center justify-center">
      <div className="bg-white w-full sm:max-w-md sm:rounded-2xl rounded-t-2xl flex flex-col" style={{ height: "92vh", maxHeight: "92vh" }}>
        <div className="shrink-0 bg-white border-b border-gray-100 px-5 py-4 flex items-center justify-between">
          <div className="font-bold">{title}</div>
          <button onClick={onClose} className="text-gray-500 p-1 text-lg">✕</button>
        </div>
        <div className="flex-1 overflow-y-auto px-5 py-4">{children}</div>
        {footer && <div className="shrink-0 border-t border-gray-100 px-5 py-3.5 bg-white">{footer}</div>}
      </div>
    </div>
  );
}
function Field({ label, children }) { return <div className="mb-4"><div className="text-xs font-medium text-gray-500 mb-1.5">{label}</div>{children}</div>; }

function AddRaceModal({ onClose, onSave }) {
  const [name, setName] = useState(""); const [location, setLocation] = useState("");
  const [startDate, setStartDate] = useState(todayISO()); const [endDate, setEndDate] = useState(todayISO());
  const canSave = name.trim() && location.trim() && startDate && endDate && startDate <= endDate;
  return (
    <ModalShell title="Nový pretek" onClose={onClose} footer={
      <button disabled={!canSave} onClick={() => onSave({ name: name.trim(), location: location.trim(), startDate, endDate })}
        className="w-full bg-orange-600 disabled:bg-gray-200 disabled:text-gray-400 text-white rounded-xl py-3.5 font-semibold text-sm">Uložiť pretek</button>
    }>
      <Field label="Názov preteku"><input value={name} onChange={(e) => setName(e.target.value)} placeholder="napr. Malá Fatra Enduro" className="input" /></Field>
      <Field label="Miesto"><input value={location} onChange={(e) => setLocation(e.target.value)} placeholder="napr. Terchová" className="input" /></Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Od"><input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} className="input" /></Field>
        <Field label="Do"><input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} className="input" /></Field>
      </div>
    </ModalShell>
  );
}

function AddExpenseModal({ races, defaultRaceId, currentUser, onClose, onSave }) {
  const t = todayISO();
  const sorted = races.slice().sort((a, b) => a.startDate.localeCompare(b.startDate));
  const currentRace = races.find((r) => t >= r.startDate && t <= r.endDate);
  const fallbackRaceId = defaultRaceId || currentRace?.id || sorted[sorted.length - 1]?.id || "";

  const [imageDataUrl, setImageDataUrl] = useState(null);
  const [ocrState, setOcrState] = useState("idle");
  const [amount, setAmount] = useState(""); const [currency, setCurrency] = useState("EUR");
  const [date, setDate] = useState(t); const [vendor, setVendor] = useState("");
  const [category, setCategory] = useState("phm"); const [raceId, setRaceId] = useState(fallbackRaceId);
  const [note, setNote] = useState(""); const [saving, setSaving] = useState(false);

  const handleFile = async (file) => {
    if (!file) return;
    const dataUrl = await fileToCompressedBase64(file);
    setImageDataUrl(dataUrl); setOcrState("loading");
    try {
      const result = await extractReceiptData(dataUrl);
      if (result.amount) setAmount(String(result.amount));
      if (result.currency && CURRENCIES.includes(result.currency)) setCurrency(result.currency);
      if (result.date) setDate(result.date);
      if (result.vendor) setVendor(result.vendor);
      setOcrState("done");
    } catch (err) { setOcrState("error"); }
  };

  const canSave = amount && parseFloat(amount) > 0 && raceId && date;

  const handleSave = async () => {
    setSaving(true);
    const id = uid(); const amt = parseFloat(amount);
    const expense = {
      id, raceId, category, amount: amt, currency,
      amountEUR: Math.round(amt * (RATES_TO_EUR[currency] || 1) * 100) / 100,
      date, vendor: vendor.trim(), note: note.trim(), addedBy: currentUser, createdAt: new Date().toISOString(),
    };
    if (imageDataUrl) { try { await kvSet("ctm-receipt:" + id, imageDataUrl); } catch (e) {} }
    await onSave(expense);
    setSaving(false);
  };

  return (
    <ModalShell title="Nový bloček" onClose={onClose} footer={
      <button disabled={!canSave || saving} onClick={handleSave} className="w-full bg-orange-600 disabled:bg-gray-200 disabled:text-gray-400 text-white rounded-xl py-3.5 font-semibold text-sm flex items-center justify-center gap-2">
        {saving && <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin" />}Uložiť bloček
      </button>
    }>
      {!imageDataUrl ? (
        <label className="w-full border-2 border-dashed border-gray-300 rounded-xl py-10 flex flex-col items-center justify-center gap-2 text-gray-500 mb-4 cursor-pointer hover:border-orange-600 hover:text-orange-600">
          <span className="text-3xl">📷</span><span className="text-sm font-medium">Odfotiť / vybrať bloček</span>
          <input type="file" accept="image/*" capture="environment" className="hidden" onChange={(e) => handleFile(e.target.files?.[0])} />
        </label>
      ) : (
        <div className="relative mb-4">
          <img src={imageDataUrl} alt="Bloček" className="w-full max-h-56 object-cover rounded-xl border border-gray-200" />
          <button onClick={() => { setImageDataUrl(null); setOcrState("idle"); }} className="absolute top-2 right-2 bg-black/60 text-white rounded-full p-1.5 w-7 h-7 flex items-center justify-center">✕</button>
          {ocrState === "loading" && <div className="absolute inset-0 bg-black/40 rounded-xl flex items-center justify-center gap-2 text-white text-sm font-medium">⏳ Rozpoznávam bloček...</div>}
        </div>
      )}
      {ocrState === "error" && <div className="flex items-center gap-2 text-amber-600 text-xs bg-amber-50 rounded-lg px-3 py-2 mb-4">⚠️ Nepodarilo sa rozpoznať údaje, zadaj ich ručne.</div>}
      {ocrState === "done" && <div className="flex items-center gap-2 text-green-600 text-xs bg-green-50 rounded-lg px-3 py-2 mb-4">✓ Údaje rozpoznané, skontroluj ich.</div>}
      <div className="grid grid-cols-2 gap-3">
        <Field label="Suma"><input type="number" inputMode="decimal" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0.00" className="input mono" /></Field>
        <Field label="Mena"><select value={currency} onChange={(e) => setCurrency(e.target.value)} className="input">{CURRENCIES.map((c) => <option key={c} value={c}>{c}</option>)}</select></Field>
      </div>
      <Field label="Dátum"><input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="input" /></Field>
      <Field label="Obchod / dodávateľ (voliteľné)"><input value={vendor} onChange={(e) => setVendor(e.target.value)} placeholder="napr. Shell" className="input" /></Field>
      <Field label="Kategória">
        <div className="grid grid-cols-3 gap-2">
          {CATEGORIES.map((c) => {
            const active = category === c.id;
            return (
              <button key={c.id} onClick={() => setCategory(c.id)} className={`flex flex-col items-center gap-1 rounded-xl py-2.5 border text-xs font-medium ${active ? "border-transparent text-white" : "border-gray-200 text-gray-600"}`} style={active ? { backgroundColor: c.color } : {}}>
                <span className="text-base">{c.emoji}</span>{c.label}
              </button>
            );
          })}
        </div>
      </Field>
      <Field label="Pretek">
        <select value={raceId} onChange={(e) => setRaceId(e.target.value)} className="input">
          <option value="">Vyber pretek</option>
          {sorted.map((r) => <option key={r.id} value={r.id}>{r.name} ({fmtDateShort(r.startDate)})</option>)}
        </select>
      </Field>
      <Field label="Poznámka (voliteľné)"><input value={note} onChange={(e) => setNote(e.target.value)} placeholder="napr. výmena pneumatiky" className="input" /></Field>
    </ModalShell>
  );
}

function StatsScreen({ races, expenses }) {
  const years = useMemo(() => {
    const s = new Set(races.map((r) => r.startDate.slice(0, 4)));
    if (s.size === 0) s.add(String(new Date().getFullYear()));
    return Array.from(s).sort((a, b) => b.localeCompare(a));
  }, [races]);
  const [year, setYear] = useState(years[0]);
  const yearRaceIds = new Set(races.filter((r) => r.startDate.startsWith(year)).map((r) => r.id));
  const yearExpenses = expenses.filter((e) => yearRaceIds.has(e.raceId));
  const total = yearExpenses.reduce((s, e) => s + e.amountEUR, 0);
  const byCategory = CATEGORIES.map((c) => ({ ...c, sum: yearExpenses.filter((e) => e.category === c.id).reduce((s, e) => s + e.amountEUR, 0) })).filter((c) => c.sum > 0).sort((a, b) => b.sum - a.sum);
  const byPerson = ALL_MEMBERS.map((name) => ({ name, sum: yearExpenses.filter((e) => e.addedBy === name).reduce((s, e) => s + e.amountEUR, 0), count: yearExpenses.filter((e) => e.addedBy === name).length })).filter((p) => p.count > 0).sort((a, b) => b.sum - a.sum);
  const raceCount = races.filter((r) => r.startDate.startsWith(year)).length;

  let acc = 0;
  const gradientParts = byCategory.map((c) => {
    const pct = total ? (c.sum / total) * 100 : 0;
    const part = `${c.color} ${acc}% ${acc + pct}%`;
    acc += pct;
    return part;
  });
  const donutStyle = byCategory.length ? { background: `conic-gradient(${gradientParts.join(",")})` } : { background: "#E5E7EB" };

  return (
    <div className="px-5 pt-5">
      <div className="flex gap-2 mb-5 overflow-x-auto">
        {years.map((y) => (
          <button key={y} onClick={() => setYear(y)} className={`px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap ${y === year ? "bg-gray-900 text-white" : "bg-white border border-gray-200 text-gray-500"}`}>{y}</button>
        ))}
      </div>
      <div className="bg-white rounded-2xl border border-gray-200 p-5 mb-5">
        <div className="text-xs text-gray-400 mb-1">Celkový cashflow {year}</div>
        <div className="mono text-3xl font-bold mb-3">{fmtEUR(total)}</div>
        <div className="flex gap-4 text-xs text-gray-500"><span>{raceCount} pretekov</span><span>{yearExpenses.length} bločkov</span></div>
      </div>
      {byCategory.length > 0 && (
        <div className="bg-white rounded-2xl border border-gray-200 p-5 mb-5">
          <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">Podľa kategórie</div>
          <div className="flex justify-center mb-4"><div className="w-36 h-36 rounded-full" style={donutStyle}><div className="w-20 h-20 bg-white rounded-full m-auto relative" style={{ marginTop: "32px" }} /></div></div>
          <div className="space-y-2">
            {byCategory.map((c) => (
              <div key={c.id} className="flex items-center justify-between text-sm">
                <span className="flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: c.color }} />{c.label}</span>
                <span className="mono text-gray-600">{fmtEUR(c.sum)} <span className="text-gray-400 text-xs">({Math.round((c.sum / total) * 100)}%)</span></span>
              </div>
            ))}
          </div>
        </div>
      )}
      {byPerson.length > 0 && (
        <div className="bg-white rounded-2xl border border-gray-200 p-5 mb-6">
          <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">Podľa osoby</div>
          <div className="space-y-3">
            {byPerson.map((p) => (
              <div key={p.name} className="flex items-center justify-between text-sm">
                <div><div className="font-medium">{p.name}</div><div className="text-xs text-gray-400">{p.count} bločkov</div></div>
                <div className="mono font-semibold">{fmtEUR(p.sum)}</div>
              </div>
            ))}
          </div>
        </div>
      )}
      {yearExpenses.length === 0 && <div className="text-sm text-gray-400 text-center py-10">Za tento rok zatiaľ nie sú žiadne dáta</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
